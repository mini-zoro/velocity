[workspace]
resolver = "3"
members = ["crates/*"]
# Standalone research workspaces (benchmarks, prototypes) are not part of the product build.
exclude = ["spikes", "prototypes"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mini-zoro/velocity"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Keep line tables so Instruments / samply profiles are readable.
debug = "line-tables-only"

[profile.bench]
inherits = "release"
