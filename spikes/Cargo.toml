[workspace]
resolver = "3"
members = ["bench-common", "bench-buffer", "bench-syntax", "bench-search", "bench-text"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bench-common = { path = "bench-common" }
anyhow = "=1.0.104"
serde_json = "=1.0.154"
walkdir = "=2.5.0"
libc = "=0.2.191"

[profile.release]
debug = 1
