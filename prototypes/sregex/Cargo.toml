[package]
name = "sregex-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
fancy-regex = "0.20.2"
onig = { version = "6.5.3", default-features = false }
yaml-rust2 = "0.13.0"
memchr = "2.8.3"
aho-corasick = "1.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
debug = 1

