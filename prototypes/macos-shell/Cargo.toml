[package]
name = "vel-shell"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
libc = "=0.2.191"
memmap2 = "=0.9.12"
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
swash = "=0.2.10"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
wgpu = { version = "=30.0.2", default-features = false, features = ["metal", "wgsl", "std", "parking_lot"] }
winit = "=0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = "=0.3.2"
objc2-metal = "=0.3.2"
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
objc2-core-text = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-foundation = "=0.3.2"

[dev-dependencies]
naga = { version = "=30.0.2", features = ["wgsl-in"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
