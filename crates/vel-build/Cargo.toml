[package]
name = "vel-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
vel-config = { path = "../vel-config" }
vel-scope = { path = "../vel-scope" }
vel-snippet = { path = "../vel-snippet" }
vel-text = { path = "../vel-text" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
globset = "0.4"
libc = "=0.2.191"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects",
    "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
