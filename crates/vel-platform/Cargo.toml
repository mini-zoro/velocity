[package]
name = "vel-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vel-text = { path = "../vel-text", default-features = false }
libc = "=0.2.191"
memmap2 = "=0.9.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSDocumentController", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSAlert", "NSButton", "NSControl", "NSCell", "NSRunningApplication", "NSGraphicsContext", "objc2-core-foundation", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSMenu", "NSMenuItem", "NSTextInputClient", "NSTextInputContext", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSCursor", "NSAppearance", "NSAccessibility", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSAccessibilityElement", "NSWorkspace", "NSColor", "NSScreen", "NSScroller", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CADisplayLink", "CAFrameRateRange", "CATransaction", "CABase", "objc2-core-foundation", "objc2-metal"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDrawable", "MTLTexture", "block2", "objc2-core-foundation"] }
objc2-core-foundation = "=0.3.2"
objc2-core-text = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "=0.3.2"
[target.'cfg(windows)'.dependencies]
swash = "=0.2.10"
vel-fileio = { path = "../vel-fileio" }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell_Common"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory",
    "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_Registry",
    "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
