[package]
name = "vel-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vel-text = { path = "../vel-text", default-features = false }
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSAlert", "NSButton", "NSControl", "NSCell", "NSRunningApplication", "NSGraphicsContext", "objc2-core-foundation", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSMenu", "NSMenuItem", "NSTextInputClient", "NSTextInputContext", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSCursor", "NSAppearance", "NSAccessibility", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSAccessibilityElement", "NSWorkspace", "NSColor", "NSScreen", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CADisplayLink", "CAFrameRateRange", "CATransaction", "CABase", "objc2-core-foundation", "objc2-metal"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDrawable", "MTLTexture", "block2", "objc2-core-foundation"] }
objc2-core-foundation = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "=0.3.2"
