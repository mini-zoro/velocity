[package]
name = "vel-text"
description = "Persistent rope with byte/char/UTF-16/line metrics for the Velocity editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memchr = "2"
simdutf8 = "0.1.5"
unicode-segmentation = "1"
regex-cursor = { version = "0.1", optional = true, default-features = false }

[features]
default = ["regex-cursor"]
regex-cursor = ["dep:regex-cursor"]

[dev-dependencies]
crop = "0.4"
ropey = "1"
proptest = "1"
libc = "0.2"

[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
