[package]
name = "vel-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vel-syntax = { path = "../vel-syntax" }
vel-scope = { path = "../vel-scope" }
vel-text = { path = "../vel-text", default-features = false }
vel-highlight = { path = "../vel-highlight" }
vel-search = { path = "../vel-search" }
vel-fileio = { path = "../vel-fileio" }
ignore = "0.4"
hashlink = "0.12"
notify = "=8.2.0"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1"
libc = "0.2"
thiserror = "2"

[dev-dependencies]
vel-regex = { path = "../vel-regex" }
vel-color-scheme = { path = "../vel-color-scheme" }
tempfile = "=3.27.0"
serde_json = "1"
