[package]
name = "vel-fileio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
vel-largefile = { path = "../vel-largefile" }
vel-buffer = { path = "../vel-buffer" }
vel-text = { path = "../vel-text", default-features = false }
vel-config = { path = "../vel-config" }
encoding_rs = "=0.8.35"
blake3 = "1"
memchr = "2"
simdutf8 = "0.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
notify = "=8.2.0"
tempfile = "=3.27.0"
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde_json = "=1.0.154"
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_UI_Shell"] }
[dev-dependencies]
proptest = "=1.12.0"
