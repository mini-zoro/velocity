[package]
name = "velocity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vel-vintage = { path = "../vel-vintage" }
vel-diff = { path = "../vel-diff" }
vel-git = { path = "../vel-git" }
vel-spell = { path = "../vel-spell" }
libc = "=0.2.191"
vel-build = { path = "../vel-build" }
vel-session = { path = "../vel-session" }
vel-highlight = { path = "../vel-highlight" }
vel-index = { path = "../vel-index" }
vel-complete = { path = "../vel-complete" }
vel-snippet = { path = "../vel-snippet" }
vel-syntax = { path = "../vel-syntax" }
vel-scope = { path = "../vel-scope" }
vel-color-scheme = { path = "../vel-color-scheme" }
vel-buffer = { path = "../vel-buffer" }
vel-config = { path = "../vel-config" }
vel-commands = { path = "../vel-commands" }
vel-fileio = { path = "../vel-fileio" }
vel-ui = { path = "../vel-ui" }
vel-search = { path = "../vel-search" }
vel-platform = { path = "../vel-platform" }
vel-render = { path = "../vel-render" }
vel-text = { path = "../vel-text", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
tempfile = "=3.27.0"


vel-theme = { path = "../vel-theme" }
vel-minihtml = { path = "../vel-minihtml" }

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
