[package]
name = "velocity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
highlight-profile = ["vel-highlight/profile", "vel-syntax/matcher-profile"]

[dependencies]
vel-crash = { path = "../vel-crash" }
vel-packages = { path = "../vel-packages" }
vel-vintage = { path = "../vel-vintage" }
vel-diff = { path = "../vel-diff" }
vel-git = { path = "../vel-git" }
vel-spell = { path = "../vel-spell" }
libc = "=0.2.191"
bincode = "1.3"
vel-build = { path = "../vel-build" }
vel-session = { path = "../vel-session" }
vel-highlight = { path = "../vel-highlight" }
vel-export = { path = "../vel-export" }
vel-index = { path = "../vel-index" }
vel-complete = { path = "../vel-complete" }
vel-snippet = { path = "../vel-snippet" }
vel-syntax = { path = "../vel-syntax" }
vel-scope = { path = "../vel-scope" }
vel-color-scheme = { path = "../vel-color-scheme" }
vel-largefile = { path = "../vel-largefile" }
vel-buffer = { path = "../vel-buffer" }
vel-config = { path = "../vel-config" }
vel-i18n = { path = "../vel-i18n" }
vel-commands = { path = "../vel-commands" }
vel-fileio = { path = "../vel-fileio" }
vel-ui = { path = "../vel-ui" }
vel-search = { path = "../vel-search" }
vel-platform = { path = "../vel-platform" }
vel-render = { path = "../vel-render" }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "tga"] }
vel-text = { path = "../vel-text", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
tempfile = "=3.27.0"
png = "=0.18.1"


vel-theme = { path = "../vel-theme" }
vel-minihtml = { path = "../vel-minihtml" }

[build-dependencies]
bincode = "1.3"
vel-syntax = { path = "../vel-syntax" }
syn = { version = "=2.0.119", features = ["full", "visit"] }
vel-config = { path = "../vel-config" }
vel-snippet = { path = "../vel-snippet" }

[dev-dependencies]
regex = "=1.13.1"
regex-automata = "=0.4.18"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading",
] }
