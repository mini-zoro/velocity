[package]
name = "vel-highlight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Component timers are compiled out of production and throughput builds.
profile = []

[dependencies]
vel-mailbox = { path = "../vel-mailbox" }
vel-color-scheme = { path = "../vel-color-scheme" }
vel-syntax = { path = "../vel-syntax" }
vel-scope = { path = "../vel-scope" }
vel-text = { path = "../vel-text", default-features = false }
vel-buffer = { path = "../vel-buffer" }
thiserror = "2"
fnv = "1"

[dev-dependencies]
proptest = "1"
serde_json = "1"

