[package]
name = "vel-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tempfile = "=3.27.0"
vel-packages = { path = "../vel-packages" }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
plist = "=1.10.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
vel-packages = { path = "../vel-packages", features = ["test-loopback-http"] }
