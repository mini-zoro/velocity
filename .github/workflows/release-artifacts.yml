name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal app and DMG
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install pinned toolchain and both architectures
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build and validate (ad hoc signed)
        run: scripts/package-macos.sh target/release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-macos
          path: |
            target/release-artifacts/*.app.zip
            target/release-artifacts/*.dmg
            target/release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 ZIP and installer
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target $env:CARGO_BUILD_TARGET
      - uses: Swatinem/rust-cache@v2
      - name: Build and validate unsigned packages
        run: ./scripts/package-windows.ps1 -OutputDirectory target/windows-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-windows
          path: |
            target/windows-artifacts/Velocity-*-windows-x64.zip
            target/windows-artifacts/Velocity-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    # Only a pushed version tag publishes; a manual run just builds the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check that the tag names the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          ls dist
          for platform in universal windows-x64; do
            if ! ls dist | grep -q -- "^Velocity-${version}-${platform}"; then
              echo "::error::tag $TAG does not match the packaged version (no Velocity-${version}-${platform}* asset); bump the workspace version first"
              exit 1
            fi
          done
      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          assets=(*)
          sha256sum -- "${assets[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the release checksums
        env:
          VELOCITY_UPDATE_SIGNING_KEY: ${{ secrets.VELOCITY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$VELOCITY_UPDATE_SIGNING_KEY" ]]; then
            echo '::error::VELOCITY_UPDATE_SIGNING_KEY is required to publish a release'
            exit 1
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VELOCITY_UPDATE_SIGNING_KEY" > "$key"
          unset VELOCITY_UPDATE_SIGNING_KEY
          public=$(sh scripts/update-signing.sh public-hex "$key")
          if ! grep -Fqx -- "$public" crates/vel-update/src/public-keys.hex; then
            echo '::error::The signing secret does not match a public key embedded in this tag'
            exit 1
          fi
          sh scripts/update-signing.sh sign "$key" dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          **macOS (Apple silicon and Intel):** open the DMG and drag Velocity to Applications.
          This build is not notarized (no Apple Developer ID), so macOS reports it as damaged
          or from an unidentified developer. After copying it, run once in Terminal:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Velocity.app
          ```

          **Finder "New Text File":** enable it in Velocity's command palette
          ("Finder: Enable New Text File in Context Menu") or in System Settings › General ›
          Login Items & Extensions.

          **Windows x64:** extract the ZIP and run `velocity.exe`, or use the per-user
          setup program for Start menu and Explorer integration. Run `vel.exe` from
          the terminal. The Windows builds are unsigned and may trigger SmartScreen;
          check the SHA-256 digest before choosing whether to run them.

          `SHA256SUMS.sig` is Velocity's detached Ed25519 signature over `SHA256SUMS`.
          After verifying the signature, check downloads with `shasum -a 256 -c SHA256SUMS`.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Velocity $TAG" \
            --notes-file notes.md --generate-notes
