name: GUI end-to-end

# End-to-end checks that need a real GUI session: Pinyin composition, tab drag-out,
# first-click activation, background launch. Every run starts with the capability
# probe and only runs the scenarios that probe shows the runner supports.
#
# Not a required check: it never gates a merge. auto-release.yml calls it on the
# commit it is about to publish, so a release needs it green.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_call:
  workflow_dispatch:
    inputs:
      suite:
        description: "auto = probe then every supported scenario; probe only; scenarios only; startup scenario only"
        type: choice
        default: auto
        options: [auto, probe, scenarios, startup]
      startup_cases:
        description: "startup scenario: comma-separated cases to run (empty = all)"
        type: string
        default: ""
      startup_compare_ref:
        description: "startup scenario: also build this ref (e.g. main) and launch both builds interleaved on this runner"
        type: string
        default: ""
      startup_baseline:
        description: "startup scenario: pre-fix first-content medians, e.g. light=700,dark=720 (empty = report only)"
        type: string
        default: ""

concurrency:
  group: gui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gui:
    name: gui e2e (macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          # The harness reads no package data; the product build needs no submodule.
          submodules: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-e2e
          cache-on-failure: true
      - name: Build Velocity (release)
        run: cargo build --release -p velocity --locked
      - name: Build the e2e driver
        run: scripts/e2e/run.sh build

      - name: GPU / Metal (vel-render device tests)
        continue-on-error: true
        run: |
          cargo test --release -p vel-render --lib memory_tests -- --nocapture 2>&1 | tee /tmp/gpu.log | tail -40
          {
            echo '### Metal / GPU tests'
            echo '```'
            grep -E 'test result|skipped: no GPU|adapter' /tmp/gpu.log | head -20 || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Step 1: capability table (csrutil, GUI session, TCC, HID keyboard/pointer,
      # Pinyin selection, screencapture). Also decides which scenarios run below.
      - name: Probe runner capabilities
        if: inputs.suite != 'scenarios' && inputs.suite != 'startup'
        continue-on-error: true
        run: scripts/e2e/run.sh probe

      - name: Scenarios (probe-gated)
        if: github.event_name == 'pull_request' || (inputs.suite != 'probe' && inputs.suite != 'startup')
        continue-on-error: true
        run: scripts/e2e/run.sh scenarios

      # Screen recording of cold launches only (no HID), for startup-flash work.
      # The same checkout builds the comparison ref incrementally (resource paths are
      # compiled in, so both binaries find the same packages), then is restored.
      - name: Build the comparison app
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'startup' && inputs.startup_compare_ref != ''
        env:
          COMPARE_REF: ${{ inputs.startup_compare_ref }}
        run: |
          set -euo pipefail
          ab="$RUNNER_TEMP/ab"
          mkdir -p "$ab/before" "$ab/after"
          cp target/release/velocity "$ab/after/velocity"
          git fetch --no-tags --depth=1 origin "$COMPARE_REF"
          git checkout FETCH_HEAD -- crates Cargo.toml Cargo.lock
          cargo build --release --locked -p velocity
          cp target/release/velocity "$ab/before/velocity"
          git checkout HEAD -- crates Cargo.toml Cargo.lock
          git status --short
          echo "before: $(git rev-parse FETCH_HEAD)  after: $(git rev-parse HEAD)"
          echo "E2E_STARTUP_LAUNCHERS=before=$ab/before/velocity,after=$ab/after/velocity" >> "$GITHUB_ENV"

      - name: Startup scenario only
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'startup'
        continue-on-error: true
        env:
          E2E_STARTUP_CASES: ${{ inputs.startup_cases }}
          E2E_STARTUP_BASELINE: ${{ inputs.startup_baseline }}
        run: scripts/e2e/run.sh scenario startup

      - name: Summarise
        if: always()
        run: scripts/e2e/run.sh summary

      - uses: actions/upload-artifact@v4
        # Always: a passing run still needs its AX dumps and screenshots to be checked.
        if: always()
        with:
          name: gui-e2e-artifacts
          path: |
            ${{ runner.temp }}/e2e/artifacts
            ${{ runner.temp }}/e2e/work/results
          if-no-files-found: ignore
          retention-days: 7
