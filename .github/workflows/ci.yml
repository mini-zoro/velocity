name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Report every failing test in one run instead of stopping at the first crate.
      - run: cargo test --workspace --locked --release --no-fail-fast
        env:
          # Native IPC fixtures have short wall-clock deadlines; avoid test-worker contention.
          {} # Default parallelism; readiness is signalled by the IPC fixture.
      # Performance contracts ("finishes within N ms") are enforced only with
      # VELOCITY_STRICT_TIMING=1; the parallel test step above checks their behaviour.
      # Here they run one at a time on the same build. Informational: a failure shows
      # as a warning and never fails this job (it is not a required check of its own).
      - name: Strict timing contracts (informational)
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 20
        run: scripts/strict-timing.sh
      # Memory soak: repeated workloads must return the heap to its baseline. These use
      # a counting allocator, so they run alone and single-threaded.
      - name: Memory soak
        if: success() || failure()
        run: cargo test -p velocity --bin velocity --locked --release -- --ignored --test-threads=1 memory_soak
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Validate release bundle, signing, DMG and CLI forwarding
        run: scripts/package-macos.sh target/ci-artifacts
      - name: Shell lint (when available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh crates/velocity/packaging/velocity
          fi
